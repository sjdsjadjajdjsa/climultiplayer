name: idea
description: something this should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: the problem
      description: what are you trying to do, and where does the room get in the way?
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: what it could look like
      description: optional, rough is fine
    validations:
      required: false
