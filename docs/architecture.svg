<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="t">
  <title id="t">one server holds a room: browsers over websockets, the room copy, a container for the shell, and each member's own plan</title>
  <style>
    .box { fill: #ffffff; stroke: #e0e0e7; stroke-width: 1.4; }
    .room { fill: #f7f8fb; stroke: #d7dae4; }
    .label { font: 12.5px ui-sans-serif, system-ui, sans-serif; fill: #17181d; }
    .dim { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #74757f; }
    .mono { font: 11px ui-monospace, Menlo, monospace; fill: #4a4c56; }
    .wire { stroke: #b9bcc9; stroke-width: 1.3; fill: none; }
    .note { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #8b8d95; }
    .accent { stroke: #2f6bff; }
    .good { stroke: #12915b; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#b9bcc9"/>
    </marker>
  </defs>

  <rect width="880" height="460" fill="#fcfcfd"/>

  <text class="label" x="24" y="30">browsers</text>
  <g>
    <rect class="box" x="24" y="42" width="150" height="44" rx="9"/>
    <text class="dim" x="38" y="69">you, the host</text>
    <rect class="box" x="24" y="94" width="150" height="44" rx="9"/>
    <text class="dim" x="38" y="121">a guest</text>
    <rect class="box" x="24" y="146" width="150" height="44" rx="9"/>
    <text class="dim" x="38" y="173">another guest</text>
  </g>
  <text class="note" x="24" y="212">cursor colours, chat,</text>
  <text class="note" x="24" y="227">shell lines, approvals</text>

  <rect class="room" x="250" y="42" width="380" height="366" rx="14"/>
  <text class="label" x="268" y="68">one fastify process, one room</text>
  <text class="note" x="268" y="86">every connection is a member with a role</text>

  <rect class="box" x="268" y="102" width="344" height="52" rx="9"/>
  <text class="mono" x="282" y="123">/ws/&lt;room&gt;/&lt;file&gt;</text>
  <text class="dim" x="282" y="141">yjs document per open file, seeded from disk</text>

  <rect class="box" x="268" y="166" width="344" height="52" rx="9"/>
  <text class="mono" x="282" y="187">/room/&lt;code&gt;</text>
  <text class="dim" x="282" y="205">protocol: files, shell, chat, approvals</text>

  <rect class="box" x="268" y="230" width="164" height="60" rx="9"/>
  <text class="label" x="282" y="252">room copy</text>
  <text class="dim" x="282" y="270">$CLIMP_DATA/rooms/&lt;code&gt;</text>

  <rect class="box" x="448" y="230" width="164" height="60" rx="9"/>
  <text class="label" x="462" y="252">member homes</text>
  <text class="dim" x="462" y="270">per plan, per member</text>

  <rect class="box" x="268" y="318" width="344" height="52" rx="9"/>
  <text class="label" x="282" y="339">agent plans</text>
  <text class="dim" x="282" y="357">tokens per member, kept on this machine</text>

  <text class="note" x="268" y="392">membership, invites, risk check, 90s approvals</text>
  <text class="note" x="268" y="406">and the host-only command log all live here</text>

  <rect class="box good" x="672" y="230" width="180" height="60" rx="9"/>
  <text class="label" x="686" y="252">container</text>
  <text class="dim" x="686" y="270">read-only root, no caps</text>
  <text class="mono" x="686" y="284">/workspace  /homes</text>

  <rect class="box" x="672" y="302" width="180" height="52" rx="9"/>
  <text class="label" x="686" y="323">your vendor</text>
  <text class="dim" x="686" y="341">the plan each person signed into</text>

  <path class="wire accent" d="M174 64 H206 M174 116 H206 M174 168 H206 M206 64 V192 M206 116 V192 M206 192 H262" marker-end="url(#arrow)"/>
  <path class="wire" d="M432 272 H440 V300" stroke-dasharray="3 3"/>

  <path class="wire good" d="M440 300 H666" marker-end="url(#arrow)"/>
  <text class="note" x="452" y="294">the copy is mounted, never your folder</text>

  <path class="wire accent" d="M612 192 H648 V278 H666" marker-end="url(#arrow)"/>
  <text class="note" x="618" y="182">shell, watch</text>

  <path class="wire" d="M612 344 H666" marker-end="url(#arrow)"/>
  <text class="note" x="632" y="336">own token</text>

  <text class="note" x="24" y="424">Nothing leaves this machine except the assistant calls each member makes</text>
  <text class="note" x="24" y="439">with their own token. The docker socket is never mounted into a room.</text>
</svg>
